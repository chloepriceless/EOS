# PROTOTYP (nicht fuer den Merge) — misst den Test-Speedup auf echten GitHub-
# Runnern und belegt die Runner-Kernzahl. Laeuft automatisch beim Push auf den
# Mess-Branch `speedup-proto-measure` (umgeht die workflow_dispatch-Default-
# Branch-Huerde bei Forks).
#
# Vergleicht drei Varianten des bestehenden `test`-Jobs (Issue #1553), OHNE einen
# Test wegzulassen:
#   serial   = heutiger Stand (ein Runner, nacheinander)
#   xdist    = pytest-xdist -n auto --dist loadgroup (Kerne EINES Runners)
#   sharded  = plugin-freier Datei-Shard (4 parallele Runner), je zusaetzlich xdist
#
# Wall-Zeit steht je Job in der Actions-UI. `nproc`/lscpu klaeren, wie viele vCPU
# ein ubuntu-latest-Runner wirklich hat. HINWEIS: Solange der SQLite-Reopen-
# Produktionsbug (database.py) nicht gefixt ist, schlagen unter xdist ~10 SQLite-
# Tests fehl; `|| true` haelt die Zeitmessung trotzdem fest. Nach dem Fix sauber
# nachmessen.

name: zz Speedup Prototype

permissions:
  contents: read

on:
  push:
    branches: [speedup-proto-measure]

env:
  PYTEST_BASE: --finalize --check-config-side-effect -m "not docs and not docker" -q -p "no:randomly"

jobs:
  runner-info:
    runs-on: ubuntu-latest
    steps:
      - name: Runner-Kerne und CPU belegen
        run: |
          echo "nproc = $(nproc)"
          echo "online CPUs = $(getconf _NPROCESSORS_ONLN)"
          lscpu | grep -E '^CPU\(s\)|Model name|Thread|Core' || true
          free -h || true

  serial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Tests (seriell)
        run: |
          echo "nproc = $(nproc)"
          start=$(date +%s)
          uv run pytest ${{ env.PYTEST_BASE }} || true
          echo "SERIAL_WALL_SECONDS=$(( $(date +%s) - start ))"

  xdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Tests (xdist -n auto)
        run: |
          echo "nproc = $(nproc)"
          start=$(date +%s)
          uv run pytest ${{ env.PYTEST_BASE }} -n auto --dist loadgroup || true
          echo "XDIST_WALL_SECONDS=$(( $(date +%s) - start ))"

  sharded:
    # 4 parallele Runner (Sharding ueber Maschinen), je zusaetzlich xdist ueber die
    # Kerne. Plugin-frei: Jeder Shard bekommt eine disjunkte Teilmenge der
    # Testdateien (Round-Robin ueber die sortierte Dateiliste). Jeder Test laeuft
    # genau EINMAL, nur in seinem Shard. Nicht dauerbalanciert — fuer die
    # finale Fassung die schweren Dateien (genetic*, energycharts, database)
    # gezielt verteilen.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Tests (Datei-Shard ${{ matrix.group }}/4, je -n auto)
        run: |
          FILES=$(python - <<'PY'
          import glob
          files = sorted(glob.glob("tests/test_*.py"))
          k, g = 4, ${{ matrix.group }}
          print(" ".join(f for i, f in enumerate(files) if i % k == g))
          PY
          )
          echo "Shard ${{ matrix.group }} Dateien: $(echo $FILES | wc -w)"
          start=$(date +%s)
          uv run pytest ${{ env.PYTEST_BASE }} -n auto --dist loadgroup $FILES || true
          echo "SHARD_${{ matrix.group }}_WALL_SECONDS=$(( $(date +%s) - start ))"

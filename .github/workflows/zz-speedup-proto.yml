# PROTOTYP (nicht fuer den Merge) — Messrunde 3 zum Test-Speedup auf GitHub-
# Runnern (Issue #1553 / PR #1564). Laeuft beim Push auf `speedup-proto-measure`.
#
# Bildet die vorgeschlagene Bauweise ab, ohne einen Test wegzulassen:
#   ref-ctracer  = exakt der heutige Test-Schritt aus pytest.yml (Referenz)
#   ref-sysmon   = derselbe Schritt mit COVERAGE_CORE=sysmon
#   server       = alle Tests mit Marker eos_server (echte Server, feste Ports), seriell
#   shard 0..3   = alle uebrigen Tests, dauerbalanciert verteilt, je pytest-xdist
#   coverage     = fuehrt die Coverage-Daten von server + shards zu EINEM Bericht zusammen
#   count-check  = Summe der gesammelten Faelle aller Teile == serielle Auswahl, sonst rot
#   genetic      = Genetik-Test mit 400 und 250 Generationen im selben Job, je Mess-Kern
# Jeder Coverage-Job laedt `coverage report -m` als cov.txt hoch (zeilenweiser Vergleich).

name: zz Speedup Prototype

permissions:
  contents: read

on:
  push:
    branches: [speedup-proto-measure]

jobs:
  ref-ctracer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Runner-CPU
        run: lscpu | grep -E 'Model name' ; echo "nproc = $(nproc)"
      - name: Tests (heutiger Befehl, CTracer)
        run: |
          start=$(date +%s)
          uv run pytest --finalize --check-config-side-effect -m "not docs and not docker" -vs --durations=25 --cov src --cov-report term-missing || true
          echo "WALL_SECONDS=$(( $(date +%s) - start ))"
      - name: Coverage-Bericht
        run: |
          uv run coverage report -m > cov.txt || true
          sha256sum cov.txt
          tail -n 1 cov.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cov-ref-ctracer
          path: cov.txt

  ref-sysmon:
    runs-on: ubuntu-latest
    env:
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Runner-CPU
        run: lscpu | grep -E 'Model name' ; echo "nproc = $(nproc)"
      - name: Tests (heutiger Befehl, sysmon)
        run: |
          start=$(date +%s)
          uv run pytest --finalize --check-config-side-effect -m "not docs and not docker" -vs --durations=25 --cov src --cov-report term-missing || true
          echo "WALL_SECONDS=$(( $(date +%s) - start ))"
      - name: Coverage-Bericht
        run: |
          uv run coverage report -m > cov.txt || true
          sha256sum cov.txt
          tail -n 1 cov.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cov-ref-sysmon
          path: cov.txt

  server:
    # Tests, die echte EOS-/EOSdash-Server auf den festen Ports starten: seriell,
    # ohne konkurrierende Worker auf derselben Maschine.
    runs-on: ubuntu-latest
    env:
      COVERAGE_CORE: sysmon
      COVERAGE_FILE: covdata.server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Runner-CPU
        run: lscpu | grep -E 'Model name' ; echo "nproc = $(nproc)"
      - name: Server-Tests (seriell)
        run: |
          start=$(date +%s)
          uv run pytest --finalize --check-config-side-effect -m "eos_server and not docs and not docker" -q --durations=10 --cov src --cov-report=
          echo "WALL_SECONDS=$(( $(date +%s) - start ))"
      - uses: actions/upload-artifact@v7
        with:
          name: covdata-server
          path: covdata.server

  shard:
    # Alle uebrigen Tests, dauerbalanciert auf 4 Runner verteilt, je mit xdist.
    runs-on: ubuntu-latest
    env:
      COVERAGE_CORE: sysmon
      COVERAGE_FILE: covdata.shard${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Runner-CPU
        run: lscpu | grep -E 'Model name' ; echo "nproc = $(nproc)"
      - name: Tests (Shard ${{ matrix.group }}/4, xdist)
        run: |
          FILES=$(python .github/scripts/shard_files.py 4 ${{ matrix.group }})
          echo "Shard ${{ matrix.group }} Dateien: $(echo $FILES | wc -w)"
          start=$(date +%s)
          uv run pytest --finalize --check-config-side-effect -m "not eos_server and not docs and not docker" -q --durations=10 -n auto --cov src --cov-report= --junitxml=junit-shard${{ matrix.group }}.xml $FILES
          echo "WALL_SECONDS=$(( $(date +%s) - start ))"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: covdata-shard-${{ matrix.group }}
          path: covdata.shard${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-shard-${{ matrix.group }}
          path: junit-shard${{ matrix.group }}.xml

  coverage:
    # Ein Bericht aus allen Teilen.
    needs: [server, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - uses: actions/download-artifact@v8
        with:
          pattern: covdata-*
          path: covdata
          merge-multiple: true
      - name: Zusammenfuehren + Bericht
        run: |
          ls -la covdata
          uv run coverage combine covdata/covdata.*
          uv run coverage report -m > cov.txt || true
          sha256sum cov.txt
          tail -n 1 cov.txt
      - uses: actions/upload-artifact@v7
        with:
          name: cov-parallel-combined
          path: cov.txt

  count-check:
    # Kein Test darf durch die Aufteilung still wegfallen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Faelle zaehlen
        run: |
          count() { uv run pytest --collect-only -q --finalize "$@" | tail -n 1 | grep -oE '^[0-9]+'; }
          total=$(count -m "not docs and not docker")
          server=$(count -m "eos_server and not docs and not docker")
          sum=$server
          for g in 0 1 2 3; do
            n=$(count -m "not eos_server and not docs and not docker" $(python .github/scripts/shard_files.py 4 $g))
            echo "Shard $g: $n Faelle"
            sum=$((sum + n))
          done
          echo "COUNT gesamt=$total server=$server summe_der_teile=$sum"
          test "$sum" -eq "$total"
          # Faellt der Hook still aus, liefen die Server-Tests in den Shards mit und
          # die Summe stimmte trotzdem; deshalb darf der Server-Teil nicht leer sein.
          test "$server" -gt 0

  genetic:
    # Genetik-Test des neuen Optimierers: 400 Generationen (heute) und 250 (Vorschlag)
    # im selben Job, damit die Runner-Hardware gleich ist. Die Erwartungsdatei
    # optimize_result_2_full.json bleibt unveraendert; der 250er-Lauf muss gegen sie
    # bestehen, sonst wird der Job rot.
    runs-on: ubuntu-latest
    env:
      COVERAGE_CORE: ${{ matrix.core }}
    strategy:
      fail-fast: false
      matrix:
        core: [ctrace, sysmon]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install uv
        run: python -m pip install --upgrade pip && pip install uv
      - name: Sync
        run: uv sync --extra dev
      - name: Runner-CPU
        run: lscpu | grep -E 'Model name' ; echo "nproc = $(nproc)"
      - name: Genetik-Test mit 400 Generationen (heute)
        run: |
          uv run pytest --finalize tests/test_geneticoptimize.py -q --durations=3 --cov src --cov-report=
      - name: Genetik-Test mit 250 Generationen (Vorschlag)
        run: |
          sed -i 's/"optimize_result_2_full.json", 400, 0)/"optimize_result_2_full.json", 250, 0)/' tests/test_geneticoptimize.py
          grep -n '_full.json", 250, 0)' tests/test_geneticoptimize.py
          uv run pytest --finalize tests/test_geneticoptimize.py -q --durations=3 --cov src --cov-report=

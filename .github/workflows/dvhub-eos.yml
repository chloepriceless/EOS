# DVhub-EOS only (added by tools/dvhub-eos/build-integration.sh from the dvhub-eos/tooling branch).
# The upstream workflows (pytest, pre-commit, docker-build, native) already run on every pull
# request, including pull requests against dvhub-eos/main. This one also tests the integration
# branch itself after each rebuild, with the same command as pytest.yml.
name: DVhub-EOS integration

permissions:
  contents: read

on:
  push:
    branches: ["dvhub-eos/main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync environment with uv
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest --finalize --check-config-side-effect -q -rfEs
